name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [waslc, weasel]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      # The target program of the version (ROADMAP.md): built and called with weasel.
      - name: Run examples/invoice
        if: matrix.crate == 'weasel'
        working-directory: examples/invoice
        run: |
          weasel() { cargo run --quiet --locked --manifest-path ../../weasel/Cargo.toml -- "$@"; }
          weasel build billing
          sample=$(weasel call billing invoices::sample)
          echo "sample: $sample"
          test "$(weasel call billing invoices::total "$sample")" = "ok(1170)"
          test "$(weasel call billing invoices::summary "$sample")" = '"Weasel & Co: invoice 42 for ACME (draft)"'
      # The target programs of 0.3: checkout uses the carts of catalog through handles;
      # `weasel call` composes the two components.
      - name: Run examples/catalog and examples/checkout
        if: matrix.crate == 'weasel'
        working-directory: examples/checkout
        run: |
          weasel() { cargo run --quiet --locked --manifest-path ../../weasel/Cargo.toml -- "$@"; }
          (cd ../catalog && weasel build catalog)
          weasel build checkout
          test "$(weasel call checkout orders::checkout '[{sku: "pen", quantity: 2}, {sku: "notebook", quantity: 1}]')" = "ok({items: 3, total: 725})"
          test "$(weasel call checkout orders::checkout '[{sku: "pen", quantity: 2}, {sku: "ink", quantity: 1}]')" = "err(unknown-sku)"
          test "$(weasel call checkout orders::quote '"pen"' 0)" = "err(zero-quantity)"
          test "$(weasel call checkout orders::last_sku '[{sku: "pen", quantity: 1}]')" = 'some("pen")'
          test "$(weasel call checkout orders::last_sku '[]')" = "none"
      # The WASI target program of 0.4: built with the WIT of WASI 0.3 fetched from the
      # registry, and run as a command by the wasmtime CLI.
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        if: matrix.crate == 'weasel'
      - name: Run examples/hello
        if: matrix.crate == 'weasel'
        working-directory: examples/hello
        run: |
          cargo run --quiet --locked --manifest-path ../../weasel/Cargo.toml -- build hello
          test "$(wasmtime run -W gc=y -W function-references=y build/hello.wasm)" = "Hello, world!"
      # The HTTP target program of 0.4: built with the WIT of WASI 0.3, served by the
      # wasmtime CLI until `weasel serve` exists, and called with curl.
      - name: Run examples/hello-http
        if: matrix.crate == 'weasel'
        working-directory: examples/hello-http
        run: |
          cargo run --quiet --locked --manifest-path ../../weasel/Cargo.toml -- build hello_http
          wasmtime serve -W gc=y -W function-references=y --addr 127.0.0.1:8080 build/hello_http.wasm &
          server=$!
          for i in $(seq 1 100); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.1; done
          test "$(curl -sS --max-time 10 http://127.0.0.1:8080/karim)" = "Hello, /karim!"
          kill $server
