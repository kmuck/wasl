name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [waslc, weasel]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      # The target program of the version (ROADMAP.md): built and called with weasel.
      - name: Run examples/invoice
        if: matrix.crate == 'weasel'
        working-directory: examples/invoice
        run: |
          weasel() { cargo run --quiet --locked --manifest-path ../../weasel/Cargo.toml -- "$@"; }
          weasel build billing
          sample=$(weasel call invoices::sample)
          echo "sample: $sample"
          test "$(weasel call invoices::total "$sample")" = "ok(1170)"
          test "$(weasel call invoices::summary "$sample")" = '"Weasel & Co: invoice 42 for ACME (draft)"'
      # The target programs of 0.3: the resource of catalog is tested by
      # waslc/tests/resources.rs; checkout uses it through handles. Running them
      # together comes with composition.
      - name: Build examples/catalog and examples/checkout
        if: matrix.crate == 'weasel'
        working-directory: examples
        run: |
          weasel() { cargo run --quiet --locked --manifest-path ../../weasel/Cargo.toml -- "$@"; }
          (cd catalog && weasel build catalog)
          (cd checkout && weasel build checkout)
      # The WASI target program of 0.3: built with the WIT of WASI 0.2 fetched from the
      # registry, and run as a command by the wasmtime CLI.
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        if: matrix.crate == 'weasel'
      - name: Run examples/hello
        if: matrix.crate == 'weasel'
        working-directory: examples/hello
        run: |
          cargo run --quiet --locked --manifest-path ../../weasel/Cargo.toml -- build hello
          test "$(wasmtime run -W gc=y -W function-references=y build/hello.wasm)" = "Hello, world!"
