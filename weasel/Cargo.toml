[package]
name = "weasel"
version = "0.3.0"
edition = "2024"
description = "Build tool for the WaSL language"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "net", "signal", "time"] }
wasm-pkg-client = "0.16"
wasm-pkg-core = "0.16"
waslc = { version = "0.3.0", path = "../waslc" }
wasmtime = { version = "49", features = ["wave"] }
wac-graph = "0.12"
wasmtime-wasi = "49"
# `wasi:http` 0.3 for `weasel serve`, without the client of outgoing requests (§ 14.2).
wasmtime-wasi-http = { version = "49", default-features = false, features = ["p3", "component-model-async"] }

[dev-dependencies]
tempfile = "3"
wit-component = "0.261"
wit-parser = "0.261"
